name: Test GitHub mobile notification

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: github.event.head_commit.message == 'Test GitHub mobile notification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔔 BOT-TESTI – Eräluvat-vahti',
              body: '@HokkisPokkis\n\nTämä testihälytys on luotu GitHub Actions -botin toimesta samalla tavalla kuin oikea lupa-alertti.'
            })
