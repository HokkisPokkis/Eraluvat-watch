name: Eraluvat kanalintuluvat

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tarkista Evo ja Vesijako
        env:
          GH_TOKEN: ${{ github.token }}
        run: python monitor.py
